name: Build mingdfm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NDK_VER: 25.2.9519653
      ABI_ARM64: arm64-v8a
      ABI_ARMV7: armeabi-v7a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep dirs
        run: |
          mkdir -p out/mingdfm/zygisk build-arm64 build-armv7

      - name: CMake arm64
        run: |
          cd build-arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI_ARM64 \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-std=c++17 -fno-exceptions -fno-rtti -fvisibility=hidden -fvisibility-inlines-hidden"
          cmake --build . -j$(nproc)

      - name: CMake armv7
        run: |
          cd build-armv7
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI_ARMV7 \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-std=c++17 -fno-exceptions -fno-rtti -fvisibility=hidden -fvisibility-inlines-hidden"
          cmake --build . -j$(nproc)

      - name: Collect so
        run: |
          cp build-arm64/libmingdfm.so out/mingdfm/zygisk/arm64-v8a.so
          cp build-armv7/libmingdfm.so out/mingdfm/zygisk/armeabi-v7a.so

      - name: Assemble module
        run: |
          cp module.prop customize.sh post-fs-data.sh service.sh boot-completed.sh sepolicy.rule zn_modules.txt out/mingdfm/ 2>/dev/null || true
          cd out
          zip -r9 ../mingdfm.zip mingdfm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mingdfm
          path: mingdfm.zip

